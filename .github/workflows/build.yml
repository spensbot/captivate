name: Build

on:
  push:
    branches:
      - Main
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Upload installers to a new GitHub Release (uses package version)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # windows-2022: stable MSVC 2022 for node-gyp/electron-rebuild (windows-latest is VS 2026).
        os: [macos-latest, windows-2022, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Pull Git LFS
        run: git lfs pull
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            pkg-config \
            build-essential
      - name: Configure Windows native build (MSVC)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '17.0'
      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: npm install
        env:
          GYP_MSVS_VERSION: ${{ runner.os == 'Windows' && '2022' || '' }}
          JOBS: ${{ runner.os == 'Windows' && '1' || '' }}
        run: npm install
      - name: Ensure Node.js types resolve for node-link
        shell: bash
        run: |
          test -d node_modules/@types/node || (echo "Missing @types/node at repo root" && exit 1)
          mkdir -p release/app/node-link/node_modules/@types
          cp -R node_modules/@types/node release/app/node-link/node_modules/@types/node
      - name: Typecheck
        run: npm run typecheck:all
      - name: Package application bundle
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPTIVATE_DARWIN_UNIVERSAL_NATIVE: true
          CAPTIVATE_EBUILDER_OUTPUT: release/build
          CAPTIVATE_BUILD_PROJECTM_BRIDGE: true
          CAPTIVATE_BUILD_PROJECTM_RUNTIME: true
          GYP_MSVS_VERSION: '2022'
          JOBS: '1'
        run: npm run __package:bundle:inner
      - name: Package application installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          # Ad-hoc deep sign in afterPack (see .erb/scripts/macAdhocSign.js). Avoid CSC_IDENTITY
          # partial sign — it caused DYLD Team ID mismatches at launch on macOS.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CAPTIVATE_MAC_ADHOC_SIGN: '1'
          CAPTIVATE_EBUILDER_OUTPUT: release/build
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npx electron-builder build --win --publish never --config.directories.output=release/build
          elif [ "$RUNNER_OS" = "macOS" ]; then
            npx electron-builder build --mac dmg --arm64 --publish never --config.directories.output=release/build
            npx electron-builder build --mac dmg --x64 --publish never --config.directories.output=release/build
            app_arm="release/build/mac-arm64/Captivate 2.app"
            app_x64="release/build/mac/Captivate 2.app"
            if [ -d "$app_arm" ]; then
              codesign --verify --deep --strict "$app_arm"
            fi
            if [ -d "$app_x64" ]; then
              codesign --verify --deep --strict "$app_x64"
            fi
            echo "macOS DMG artifacts:"
            ls -la release/build/*-arm64.dmg release/build/*-x64.dmg 2>/dev/null || ls -la release/build/*.dmg
          else
            npx electron-builder build --linux --publish never --config.directories.output=release/build
          fi
      - name: Collect installer artifacts
        shell: bash
        run: |
          mkdir -p release/artifacts
          shopt -s nullglob
          if [ "$RUNNER_OS" = "macOS" ]; then
            for f in release/build/*-arm64.dmg release/build/*-x64.dmg; do
              cp -v "$f" release/artifacts/
            done
          else
            for f in release/build/*.exe release/build/*.AppImage release/build/*.deb release/build/*.rpm; do
              cp -v "$f" release/artifacts/
            done
          fi
          ls -la release/artifacts/
          if [ -z "$(ls -A release/artifacts)" ]; then
            echo "No installer artifacts found under release/build"
            ls -laR release/build || true
            exit 1
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Captivate-${{ runner.os }}
          path: release/artifacts/*
          if-no-files-found: error

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            version="$(jq -r .version release/app/package.json)"
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag}"
      - name: Download artifacts for all builds
        uses: actions/download-artifact@v4
        with:
          path: release/artifacts
          merge-multiple: true
      - name: List release files
        run: ls -la release/artifacts/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          version="${tag#v}"
          notes_file="docs/RELEASE-NOTES-${version}.md"
          if [[ ! -f "$notes_file" ]]; then
            notes_file="$(mktemp)"
            cat > "$notes_file" <<EOF
          ## Captivate 2 ${version}

          Cross-platform installers built from [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

          See [\`docs/RELEASE-NOTES-${version}.md\`](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/docs/RELEASE-NOTES-${version}.md) in the repository for release notes.
          EOF
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading assets"
          else
            gh release create "$tag" \
              --title "Captivate 2 ${version}" \
              --notes-file "$notes_file"
          fi
          gh release upload "$tag" release/artifacts/* --clobber
