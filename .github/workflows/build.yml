name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Pull Git LFS
        run: git lfs pull
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libasound2-dev libx11-dev libgl1-mesa-dev
      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
      - uses: actions/setup-python@v4 # https://github.com/nodejs/node-gyp/issues/2869
        with:
          python-version: '3.11'
      - name: npm install
        run: |
          npm install
      - name: npm test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run package
          npm exec tsc
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Captivate-${{ runner.os }}
          path: |
            release/build/*.AppImage
            release/build/*.dmg
            release/build/*.exe
  release:
    if: github.ref == 'refs/heads/fwcd'
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0' # to compute the monotonic version correctly
      - name: Download artifacts for all builds
        uses: actions/download-artifact@v4
        with:
          path: release/build
      - name: Create a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r .version release/app/package.json)"
          count="$(git rev-list --count HEAD)"
          sha="$(git rev-parse --short HEAD)"
          tag="v$version.c$count.r$sha"
          gh release create --title "$tag" "$tag" || true
          gh release upload "$tag" release/build/**/* || true
