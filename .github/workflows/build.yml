name: Build

on:
  push:
    branches:
      - Main
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Upload installers to a new GitHub Release (uses package version)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Pull Git LFS
        run: git lfs pull
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            pkg-config \
            build-essential
      - name: Configure Windows native build (MSVC)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: npm install
        run: npm install
      - name: Ensure Node.js types resolve for node-link
        shell: bash
        run: |
          test -d node_modules/@types/node || (echo "Missing @types/node at repo root" && exit 1)
          mkdir -p release/app/node-link/node_modules/@types
          cp -R node_modules/@types/node release/app/node-link/node_modules/@types/node
      - name: Typecheck
        run: npm run typecheck:all
      - name: Package application bundle
        env:
          CI: true
          CAPTIVATE_EBUILDER_OUTPUT: release/build
          CAPTIVATE_BUILD_PROJECTM_BRIDGE: true
          GYP_MSVS_VERSION: '2022'
          JOBS: '1'
        run: npm run __package:bundle:inner
      - name: Package application installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CAPTIVATE_EBUILDER_OUTPUT: release/build
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npx electron-builder build --win --publish never --config.directories.output=release/build
          elif [ "$RUNNER_OS" = "macOS" ]; then
            npx electron-builder build --mac --publish never --config.directories.output=release/build
          else
            npx electron-builder build --linux --publish never --config.directories.output=release/build
          fi
      - name: Collect installer artifacts
        shell: bash
        run: |
          mkdir -p release/artifacts
          shopt -s nullglob
          for f in release/build/*.exe release/build/*.dmg release/build/*.AppImage release/build/*.deb release/build/*.rpm; do
            cp -v "$f" release/artifacts/
          done
          ls -la release/artifacts/
          if [ -z "$(ls -A release/artifacts)" ]; then
            echo "No installer artifacts found under release/build"
            ls -laR release/build || true
            exit 1
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Captivate-${{ runner.os }}
          path: release/artifacts/*
          if-no-files-found: error

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            version="$(jq -r .version release/app/package.json)"
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag}"
      - name: Download artifacts for all builds
        uses: actions/download-artifact@v4
        with:
          path: release/artifacts
          merge-multiple: true
      - name: List release files
        run: ls -la release/artifacts/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          version="${tag#v}"
          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          ## Captivate 2 ${version}

          Cross-platform installers built from [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

          ### Downloads
          - **Windows** — \`.exe\` NSIS installer
          - **macOS** — \`.dmg\` disk image (Apple Silicon + Intel)
          - **Linux** — \`.AppImage\`

          End users only need the installer for their operating system.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading assets"
          else
            gh release create "$tag" \
              --title "Captivate 2 ${version}" \
              --notes-file "$notes_file"
          fi
          gh release upload "$tag" release/artifacts/* --clobber
